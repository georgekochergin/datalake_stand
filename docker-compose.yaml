name: dlh-poc

networks:
  dlh-poc:

volumes:
  pg_catalog_data:
  pg_meta_data:
  airflow_pg_data:
  airflow_logs:
  silo_data:
  sydafa_state:
  sydafa_bank_data:
    name: ${SYDAFA_CONTAINER_PREFIX:-sydafa}-data-mssql-bank
  sydafa_broker_data:
    name: ${SYDAFA_CONTAINER_PREFIX:-sydafa}-data-oracle-broker
  trino_auth:

services:

  # ---------- Сервис sydafa (эмулятор и оркестратор СУБД-источников) ----------

  sydafa:
    image: ${SYDAFA_IMAGE:-ghcr.io/georgekochergin/sydafa:latest}
    platform: linux/amd64
    healthcheck:
      start_period: 15m
    environment:
      - SYDAFA_CONTAINER_PREFIX=${SYDAFA_CONTAINER_PREFIX:-sydafa}
      - SYDAFA_MAX_TTL_MINUTES=30
      - SYDAFA_TTL_MINUTES=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./conf/sydafa/sources.json:/app/config/sources.json:ro
      - sydafa_state:/state
      - sydafa_bank_data:/source-volumes/bank
      - sydafa_broker_data:/source-volumes/broker
    ports: ["8090:8000"]
    networks: [dlh-poc]

  # ---------- Каталог метаданных ----------

  pg-catalog:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: ${STAND_USER}
      POSTGRES_PASSWORD: ${STAND_PASSWORD}
    volumes: ["pg_catalog_data:/var/lib/postgresql/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAND_USER} -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 10

  pg-meta:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: meta
      POSTGRES_USER: ${STAND_USER}
      POSTGRES_PASSWORD: ${STAND_PASSWORD}
    volumes:
      - "pg_meta_data:/var/lib/postgresql/data"
      - ./conf/pg-meta/init:/docker-entrypoint-initdb.d:ro
    ports: ["55432:5432"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAND_USER} -d meta"]
      interval: 10s
      timeout: 5s
      retries: 10

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    environment:
      nessie.version.store.type: JDBC
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://pg-catalog:5432/nessie
      quarkus.datasource.username: ${STAND_USER}
      quarkus.datasource.password: ${STAND_PASSWORD}
      # Iceberg REST-каталог: объектное хранилище SILO + warehouse "raw" (layer = catalog)
      nessie.catalog.default-warehouse: raw
      nessie.catalog.warehouses.raw.location: s3://datalake/raw/
      nessie.catalog.service.s3.default-options.endpoint: http://silo:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.auth-type: STATIC
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${STAND_USER}
      nessie.catalog.secrets.access-key.secret: ${STAND_PASSWORD}
      nessie.server.authentication.enabled: "false"
    ports: ["19120:19120"]
    depends_on: {pg-catalog: {condition: service_healthy}}
    networks: [dlh-poc]

  # ---------- Объектное хранилище ----------

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STAND_USER}
      MINIO_ROOT_PASSWORD: ${STAND_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["silo_data:/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  silo-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${STAND_USER}
      AWS_SECRET_ACCESS_KEY: ${STAND_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes: ["./conf/silo/init-bucket.sh:/init-bucket.sh:ro"]
    depends_on: {silo: {condition: service_healthy}}
    networks: [dlh-poc]

  # ---------- Вычисления ----------

  spark-master:
    build: {context: ., dockerfile: conf/spark/Dockerfile}
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"]
    ports: ["7077:7077", "8080:8080"]
    environment: &spark-env
      AWS_ACCESS_KEY_ID: ${STAND_USER}
      AWS_SECRET_ACCESS_KEY: ${STAND_PASSWORD}
      AWS_REGION: us-east-1
    volumes: ["./ingestion/spark:/opt/spark-jobs:ro"]
    depends_on:
      nessie: {condition: service_started}
      silo-init: {condition: service_completed_successfully}
      sydafa: {condition: service_healthy}
    networks: [dlh-poc]

  spark-worker:
    build: {context: ., dockerfile: conf/spark/Dockerfile}
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081"]
    environment: *spark-env
    volumes: ["./ingestion/spark:/opt/spark-jobs:ro"]
    ports: ["8081:8081"]
    depends_on: [spark-master]
    networks: [dlh-poc]

  trino-init:
    image: httpd:2-alpine
    entrypoint: ["/bin/sh", "/init-auth.sh"]
    environment:
      STAND_USER: ${STAND_USER}
      STAND_PASSWORD: ${STAND_PASSWORD}
    volumes:
      - ./conf/trino/init-auth.sh:/init-auth.sh:ro
      - trino_auth:/auth
    networks: [dlh-poc]

  trino:
    image: trinodb/trino:479
    environment:
      AWS_ACCESS_KEY_ID: ${STAND_USER}
      AWS_SECRET_ACCESS_KEY: ${STAND_PASSWORD}
    ports: ["8443:8443"] # HTTPS (password auth); HTTP 8080 остаётся только внутри сети для Airflow
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./conf/trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - trino_auth:/auth:ro
      - ./conf/trino/keystore.p12:/etc/trino/keystore.p12:ro
      - ./trino:/opt/trino-sql:ro
    depends_on:
      nessie: {condition: service_started}
      trino-init: {condition: service_completed_successfully}
    networks: [dlh-poc]

  # ---------- Оркестрация ----------

  airflow-postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: ${STAND_USER}
      POSTGRES_PASSWORD: ${STAND_PASSWORD}
    volumes: ["airflow_pg_data:/var/lib/postgresql/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAND_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    pull_policy: build
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow connections get bank_source >/dev/null 2>&1 ||
          airflow connections add bank_source \
            --conn-uri 'mssql://sydafa:sydafa@${SYDAFA_CONTAINER_PREFIX:-sydafa}-src-mssql-bank:1433/sydafa'
        airflow connections get broker_source >/dev/null 2>&1 ||
          airflow connections add broker_source \
            --conn-uri 'oracle://sydafa:sydafa@${SYDAFA_CONTAINER_PREFIX:-sydafa}-src-oracle-broker:1521/sydafa'
        airflow connections get spark_default >/dev/null 2>&1 ||
          airflow connections add spark_default \
            --conn-type spark --conn-host 'spark://spark-master' --conn-port 7077 \
            --conn-extra '{"spark_binary": "spark-submit"}'
        airflow connections get trino_default >/dev/null 2>&1 ||
          airflow connections add trino_default \
            --conn-type trino --conn-host trino --conn-port 8443 --conn-schema raw \
            --conn-login "$${STAND_USER}" --conn-password "$${STAND_PASSWORD}" \
            --conn-extra '{"protocol": "https", "verify": "false"}'
        airflow connections get sydafa_default >/dev/null 2>&1 ||
          airflow connections add sydafa_default \
            --conn-type http --conn-host 'http://sydafa' --conn-port 8000
        airflow connections get ingestion_meta >/dev/null 2>&1 ||
          airflow connections add ingestion_meta \
            --conn-type postgres --conn-host pg-meta --conn-port 5432 --conn-schema meta \
            --conn-login "$${STAND_USER}" --conn-password "$${STAND_PASSWORD}"
        airflow pools set ingest_loads 4 'Raw-layer ingestion load tasks (shared across ingest DAGs)'
    environment: &airflow-env
      <<: *spark-env
      PYTHONPATH: /opt/python
      STAND_USER: ${STAND_USER}
      STAND_PASSWORD: ${STAND_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${STAND_USER}:${STAND_PASSWORD}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${STAND_USER}:ADMIN"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json.generated
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__EXPOSE_CONFIG: auth_admin
      AIRFLOW__API__SECRET_KEY: "datalake-stand-test-api-secret-f0e827fa722b305a302101d870f7d360c20573180abb40c0204c719127588b59"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "datalake-stand-test-jwt-secret-0123456789abcdef"
    depends_on:
      airflow-postgres: {condition: service_healthy}
      pg-meta: {condition: service_healthy}
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
    networks: [dlh-poc]

  airflow-scheduler:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    pull_policy: build
    command: ["scheduler"]
    environment: *airflow-env
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./ingestion:/opt/python/ingestion:ro
      - ./ingestion/spark:/opt/spark-jobs:ro
      - ./trino:/opt/airflow/sql:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  airflow-dag-processor:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    pull_policy: build
    command: ["dag-processor"]
    environment: *airflow-env
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./ingestion:/opt/python/ingestion:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  airflow-webserver:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    pull_policy: build
    command: ["api-server"] # ⚠ Airflow 3.x: проверить точное имя команды/компонента на этапе реализации (см. docs/README.md)
    environment: *airflow-env
    ports: ["8089:8080"]
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./ingestion:/opt/python/ingestion:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  # ---------- Полный тестовый флоу (запускается через test/test.sh) ----------

  test-runner:
    build: ./test
    image: dlh-poc-test-runner
    pull_policy: build
    profiles: ["test"]
    environment:
      AIRFLOW_USER: ${STAND_USER}
      AIRFLOW_PASSWORD: ${STAND_PASSWORD}
      TRINO_USER: ${STAND_USER}
      TRINO_PASSWORD: ${STAND_PASSWORD}
    depends_on:
      sydafa: {condition: service_healthy}
      nessie: {condition: service_started}
      trino: {condition: service_started}
      airflow-webserver: {condition: service_started}
      spark-master: {condition: service_started}
      spark-worker: {condition: service_started}
    networks: [dlh-poc]
