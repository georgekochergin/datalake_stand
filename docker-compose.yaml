name: dlh-poc

networks:
  dlh-poc:

volumes:
  pg_catalog_data:
  pg_meta_data:
  airflow_pg_data:
  silo_data:
  sydafa_state:

services:

  # ---------- Сервис sydafa (эмулятор и оркестратор СУБД-источников) ----------

  sydafa:
    image: ${SYDAFA_IMAGE:-sydafa:latest}
    environment:
      - SYDAFA_MAX_TTL_MINUTES=30
      - SYDAFA_TTL_MINUTES=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./conf/sydafa/sources.json:/app/config/sources.json:ro
      - sydafa_state:/state
    ports: ["8090:8000"]
    networks: [dlh-poc]

  # ---------- Каталог метаданных ----------

  pg-catalog:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: ${PG_CATALOG_USER}
      POSTGRES_PASSWORD: ${PG_CATALOG_PASSWORD}
    volumes: ["pg_catalog_data:/var/lib/postgresql/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_CATALOG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pg-meta:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: meta
      POSTGRES_USER: ${PG_META_USER}
      POSTGRES_PASSWORD: ${PG_META_PASSWORD}
    volumes: ["pg_meta_data:/var/lib/postgresql/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_META_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    environment:
      nessie.version.store.type: JDBC
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://pg-catalog:5432/nessie
      quarkus.datasource.username: ${PG_CATALOG_USER}
      quarkus.datasource.password: ${PG_CATALOG_PASSWORD}
      # Iceberg REST-каталог: объектное хранилище SILO + warehouse "raw" (layer = catalog)
      nessie.catalog.default-warehouse: raw
      nessie.catalog.warehouses.raw.location: s3://datalake/raw/
      nessie.catalog.service.s3.default-options.endpoint: http://silo:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.auth-type: STATIC
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${SILO_ROOT_USER}
      nessie.catalog.secrets.access-key.secret: ${SILO_ROOT_PASSWORD}
      nessie.server.authentication.enabled: "false"
    ports: ["19120:19120"]
    depends_on: {pg-catalog: {condition: service_healthy}}
    networks: [dlh-poc]

  # ---------- Объектное хранилище ----------

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["silo_data:/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  silo-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${SILO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes: ["./conf/silo/init-bucket.sh:/init-bucket.sh:ro"]
    depends_on: {silo: {condition: service_healthy}}
    networks: [dlh-poc]

  # ---------- Вычисления ----------

  spark-master:
    build: {context: ., dockerfile: conf/spark/Dockerfile}
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"]
    ports: ["7077:7077", "8080:8080"]
    environment:
      SYDAFA_URL: http://sydafa:8000
    volumes: ["./spark:/opt/spark-jobs:ro"]
    depends_on:
      nessie: {condition: service_started}
      silo-init: {condition: service_completed_successfully}
      sydafa: {condition: service_healthy}
    networks: [dlh-poc]

  spark-worker:
    build: {context: ., dockerfile: conf/spark/Dockerfile}
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081"]
    environment:
      SYDAFA_URL: http://sydafa:8000
    volumes: ["./spark:/opt/spark-jobs:ro"]
    ports: ["8081:8081"]
    depends_on: [spark-master]
    networks: [dlh-poc]

  trino:
    image: trinodb/trino:479
    ports: ["8443:8443"] # HTTPS (password auth); HTTP 8080 остаётся только внутри сети для Airflow
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./conf/trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./conf/trino/password.db:/etc/trino/password.db:ro
      - ./conf/trino/keystore.p12:/etc/trino/keystore.p12:ro
      - ./trino:/opt/trino-sql:ro
    depends_on: {nessie: {condition: service_started}}
    networks: [dlh-poc]

  # ---------- Оркестрация ----------

  airflow-postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: ${AIRFLOW_PG_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD}
    volumes: ["airflow_pg_data:/var/lib/postgresql/data"]
    networks: [dlh-poc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    entrypoint: ["/bin/bash", "-c"]
    command: ["airflow db migrate"]
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_PG_USER}:${AIRFLOW_PG_PASSWORD}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077?spark_binary=spark-submit"
      AIRFLOW_CONN_TRINO_DEFAULT: "trino://admin:admin@trino:8443/raw?protocol=https&verify=false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_UI_USER}:ADMIN"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "datalake-stand-test-jwt-secret-0123456789abcdef"
      AIRFLOW_CONN_SYDAFA_DEFAULT: "http://sydafa:8000"
      SYDAFA_URL: http://sydafa:8000
    depends_on:
      airflow-postgres: {condition: service_healthy}
      pg-meta: {condition: service_healthy}
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
    networks: [dlh-poc]

  airflow-scheduler:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    command: ["scheduler"]
    environment: *airflow-env
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./spark:/opt/spark-jobs:ro
      - ./trino:/opt/airflow/sql:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  airflow-dag-processor:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    command: ["dag-processor"]
    environment: *airflow-env
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  airflow-webserver:
    build: {context: ., dockerfile: conf/airflow/Dockerfile}
    image: dlh-poc-airflow:latest
    command: ["api-server"] # ⚠ Airflow 3.x: проверить точное имя команды/компонента на этапе реализации (см. README.md)
    environment: *airflow-env
    ports: ["8089:8080"]
    volumes:
      - ./airflow:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [dlh-poc]

  # ---------- Полный тестовый флоу (запускается через test/test.sh) ----------

  test-runner:
    build: ./test
    image: dlh-poc-test-runner
    profiles: ["test"]
    environment:
      AIRFLOW_UI_USER: ${AIRFLOW_UI_USER}
      AIRFLOW_UI_PASSWORD: ${AIRFLOW_UI_PASSWORD}
    depends_on:
      sydafa: {condition: service_healthy}
      nessie: {condition: service_started}
      trino: {condition: service_started}
      airflow-webserver: {condition: service_started}
      spark-master: {condition: service_started}
      spark-worker: {condition: service_started}
    networks: [dlh-poc]
