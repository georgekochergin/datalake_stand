source_id: broker
tags:
  - ingestion
  - broker
  - main
entities:
  - fqn: trading_core.transactions
    incremental:
      contract:
        source_column: _batch_id
        position_type: decimal(19,0)
      act_snap:
        airflow:
          pool:
            name: ingest_loads
            slots: 2
    airflow:
      pool:
        name: ingest_loads
        slots: 2
  - fqn: trading_core.deals
    spark:
      jdbc_partitioning: false
    airflow:
      pool:
        name: ingest_loads
