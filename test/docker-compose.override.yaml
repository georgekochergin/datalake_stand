services:
  sydafa:
    environment:
      - SYDAFA_MAX_TTL_MINUTES=30
      - SYDAFA_TTL_MINUTES=15
      - SYDAFA_CONTAINER_PREFIX=${SYDAFA_CONTAINER_PREFIX:-sydafa-dlh-test}
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - ./test/.workspace/conf/sydafa/sources.json:/app/config/sources.json:ro
      - sydafa_state:/state
      - sydafa_bank_data:/source-volumes/bank
      - sydafa_broker_data:/source-volumes/broker
    ports: !override []
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pg-meta:
    volumes: !override
      - pg_meta_data:/var/lib/postgresql/data
      - ./test/.workspace/conf/pg-meta/init:/docker-entrypoint-initdb.d:ro
    ports: !override []

  nessie:
    ports: !override []

  silo:
    ports: !override []

  spark-master:
    volumes: !override
      - ./test/.workspace/spark:/opt/spark-jobs:ro
    ports: !override []

  spark-worker:
    volumes: !override
      - ./test/.workspace/spark:/opt/spark-jobs:ro
    ports: !override []

  trino-init:
    volumes: !override
      - ./test/.workspace/conf/trino/init-auth.sh:/init-auth.sh:ro
      - trino_auth:/auth

  trino:
    volumes: !override
      - ./test/.workspace/conf/trino/catalog:/etc/trino/catalog:ro
      - ./test/.workspace/conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./test/.workspace/conf/trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - trino_auth:/auth:ro
      - ./test/.workspace/conf/trino/keystore.p12:/etc/trino/keystore.p12:ro
      - ./test/.workspace/trino:/opt/trino-sql:ro
    ports: !override []

  airflow-init:
    volumes: !override
      - ./test/.workspace/airflow/dags:/opt/airflow/dags
      - ./test/.workspace/airflow/plugins:/opt/airflow/plugins:ro

  airflow-scheduler:
    volumes: !override
      - ./test/.workspace/airflow/dags:/opt/airflow/dags
      - ./test/.workspace/airflow/plugins:/opt/airflow/plugins:ro
      - ./test/.workspace/spark:/opt/spark-jobs:ro
      - ./test/.workspace/trino:/opt/airflow/sql:ro
      - airflow_logs:/opt/airflow/logs

  airflow-dag-processor:
    volumes: !override
      - ./test/.workspace/airflow/dags:/opt/airflow/dags
      - ./test/.workspace/airflow/plugins:/opt/airflow/plugins:ro
      - airflow_logs:/opt/airflow/logs

  airflow-webserver:
    volumes: !override
      - ./test/.workspace/airflow/dags:/opt/airflow/dags
      - ./test/.workspace/airflow/plugins:/opt/airflow/plugins:ro
      - airflow_logs:/opt/airflow/logs
    ports: !override []

  test-runner:
    volumes: !override
      - ./test/.workspace:/workspace:ro
    depends_on: !override
      sydafa:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
