rootLogger.level = INFO
rootLogger.appenderRef.stderr.ref = stderr
appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.storage.name = org.apache.spark.storage
logger.storage.level = WARN
logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = WARN
logger.security.name = org.apache.spark.SecurityManager
logger.security.level = WARN
logger.datasource.name = org.apache.spark.sql.execution.datasources
logger.datasource.level = INFO
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = INFO
logger.metrics.name = org.apache.iceberg.metrics.LoggingMetricsReporter
logger.metrics.level = WARN
