# Iceberg REST-каталог (Nessie) + S3FileIO (SILO) — см. README.md

spark.sql.extensions                                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.raw                                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.raw.catalog-impl                   org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.raw.uri                            http://nessie:19120/iceberg
spark.sql.catalog.raw.warehouse                      raw
spark.sql.catalog.raw.io-impl                        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.raw.s3.endpoint                    http://silo:9000
spark.sql.catalog.raw.s3.path-style-access           true
spark.sql.catalog.raw.s3.access-key-id               admin
spark.sql.catalog.raw.s3.secret-access-key           admin123

spark.hadoop.fs.s3a.endpoint                          http://silo:9000
spark.hadoop.fs.s3a.path.style.access                 true
spark.hadoop.fs.s3a.connection.ssl.enabled             false
